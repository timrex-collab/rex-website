name: Checks

# Typecheck, Build und Schema-Hygiene bei jedem PR und jedem Merge auf main.
#
# Warum: Bisher liefen `npm run check` und `npm run build` nur lokal vor dem Push.
# Das haelt, solange jemand daran denkt - eine gruene Kachel am PR ist die
# verlaesslichere Fassung, und sie ersetzt kein einziges bestehendes Ritual.
#
# Ausdruecklich KEIN Deploy-Schritt: Netlify baut weiterhin selbst, Merge weiterhin
# durch Tim (DEPLOY-RULES §5). Diese Action prueft nur.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Wiedervorlage: auch ohne Codeänderung abgelaufene Förderprüfung erkennen.
    - cron: '15 7 * * 1'

permissions:
  contents: read

concurrency:
  # Pro Branch serialisieren und aeltere Laeufe abbrechen - bei Checks ist nur
  # der letzte Stand interessant.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhaengigkeiten installieren
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
        env:
          VITE_WEBMCP_ENABLED: 'false'
          VITE_WEBMCP_OT_TOKEN: rex-ci-inert-test-token
      # Prueft die FAQPage-Konvention aus DEPLOY-RULES §7: mainEntity muss aus dem
      # Array kommen, das die Seite auch rendert. Zwei Fehlmessungen des Audits
      # gingen darauf zurueck, dass das nur von Hand geprueft wurde
      # (GSC-AUDIT-2026-08.md §8.1 und §8.3).
      - name: FAQPage-Schema (Drift-Check)
        run: npm run faq:check
      - name: Selbsttest des FAQ-Checks
        run: npm run faq:check -- --self-test
      # Regressions-Check der zentralen VELUX-Preislogik (client/src/lib/velux):
      # Goldwerte, Katalog-Invarianten, Determinismus. Siehe scripts/velux-estimate-check.ts.
      - name: VELUX-Preislogik (Goldwerte)
        run: npm run estimate:check
      - name: Testbrowser installieren
        run: npx playwright install --with-deps chromium
      - name: Lokale Vorschau starten
        run: |
          npx vite preview --host 0.0.0.0 --port 4179 --strictPort > /tmp/rex-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4179/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rex-preview.log
          exit 1
      - name: UI, mobile Ansicht und Druckausgabe (kein Versand)
        run: node scripts/velux-ui-smoke.mjs http://127.0.0.1:4179
      - name: WebMCP ausgeschaltet (inklusive Token-Gegenprobe)
        run: node scripts/webmcp-smoke.mjs http://127.0.0.1:4179
        env:
          SHIM: '1'
          EXPECTED_WEBMCP: 'off'
      - name: Ausschließlich lokalen WebMCP-Testbuild erstellen
        run: npm run build
        env:
          VITE_WEBMCP_ENABLED: 'true'
          VITE_WEBMCP_ORIGINS: http://127.0.0.1:4179
          VITE_WEBMCP_OT_TOKEN: rex-ci-inert-test-token
      - name: WebMCP-Vertrag im Shim (kein nativer Browsernachweis)
        run: node scripts/webmcp-smoke.mjs http://127.0.0.1:4179
        env:
          SHIM: '1'
          WEBMCP_INPUT_FORMAT: object
      - name: Fremde Origin bleibt ausgeschaltet
        run: node scripts/webmcp-smoke.mjs http://localhost:4179
        env:
          SHIM: '1'
          EXPECTED_WEBMCP: 'off'
      - name: Prüfbilder und Druck-PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velux-browser-results
          path: test-results/velux
          retention-days: 14
